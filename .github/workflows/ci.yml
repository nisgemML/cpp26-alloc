name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify-structure:
    name: Verify repo structure and proof documents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check proof documents exist
        run: |
          ls proof/ && echo "Proof documents present"

      - name: Check include structure
        run: |
          ls include/alloc/ && echo "Headers present"

      - name: Check tests exist
        run: |
          ls tests/ && echo "Tests present"

      - name: Note on compilation
        run: |
          echo "This repo uses C++26 features: std::add_sat, std::saturate_cast,"
          echo "name-independent declarations (_), and Contracts P2900R6."
          echo "These require GCC 15+ with -std=c++26, not yet on GitHub Actions runners."
          echo "Proof documents and header structure verified above."
