name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    name: Build & Test (${{ matrix.std }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        std: [c++20, c++23]
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: sudo apt-get update -q && sudo apt-get install -y g++-12

      - name: Compile tests
        run: |
          g++-12 -std=${{ matrix.std }} -O2 -Wall -Wextra \
            -I include \
            tests/*.cpp \
            -o test_runner

      - name: Run tests
        run: ./test_runner
